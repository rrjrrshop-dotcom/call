    <!-- Canonical URL and Absolute OG Image Sync Script for Social Crawlers -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var canonicalUrl = origin + window.location.pathname;
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.setAttribute('content', canonicalUrl);
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute('href', canonicalUrl);
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && ogImg.getAttribute('content').startsWith('/')) {
            ogImg.setAttribute('content', origin + ogImg.getAttribute('content'));
          }
          var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogImgSec && ogImgSec.getAttribute('content').startsWith('/')) {
            ogImgSec.setAttribute('content', origin + ogImgSec.getAttribute('content'));
          }
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && twImg.getAttribute('content').startsWith('/')) {
            twImg.setAttribute('content', origin + twImg.getAttribute('content'));
          }
        } catch (e) {}
      })();
    </script>
